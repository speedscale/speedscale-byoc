name: Lint Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "examples/security/**"
      - "recipes/datadog-to-replay/**"
      - "tests/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done

      - name: Template charts (verify render)
        run: |
          for chart in charts/*/; do
            helm template test "$chart" > /dev/null
          done

      - name: Strict lint charts
        run: |
          for chart in charts/*/; do
            helm lint --strict "$chart"
          done

      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3

      - name: Validate destination boundaries
        run: |
          python3 tests/test_channel_boundaries.py

      - name: Validate security and hardening contracts
        run: |
          python3 tests/test_security_contract.py

      - name: Validate collector configurations
        run: |
          python3 tests/validate_collectors.py

      - name: Exercise partner capture transforms
        run: |
          python3 tests/test_capture_transforms.py

      - name: Validate native GCS collector and reader
        run: |
          python3 charts/gcs/validate-config.py

      - name: Test Datadog replay recipe
        run: |
          python3 -m unittest discover -s recipes/datadog-to-replay -p 'test_*.py' -v

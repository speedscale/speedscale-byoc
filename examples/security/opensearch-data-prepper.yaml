# Data Prepper pipeline for charts/otlp/examples/opensearch-security.yaml.
# Replace the endpoint, credentials, certificate, and index policy for your
# environment before enabling OpenSearch Security Analytics detectors.
speedscale-security:
  source:
    otel_logs_source:
      ssl: true
      unframed_requests: true
      logs_path: /v1/logs
  sink:
    - opensearch:
        hosts: ["https://opensearch.example.com:9200"]
        index: speedscale-security-%{yyyy.MM.dd}
        username: ${OPENSEARCH_USERNAME}
        password: ${OPENSEARCH_PASSWORD}

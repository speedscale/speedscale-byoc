apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gcs.name" . }}
  labels:
    app.kubernetes.io/part-of: speedscale-byoc
    byoc.speedscale.com/provider: gcs
  {{- if .Values.reader.enabled }}
  annotations:
    byoc.speedscale.com/reader-pod: {{ printf "%s-0" (include "gcs.readerName" .) | quote }}
  {{- end }}
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      batch:
        send_batch_size: 1000
        send_batch_max_size: 1000
        timeout: 1s
    exporters:
      google_cloud_storage:
        bucket:
          project_id: {{ .Values.gcs.project | quote }}
          name: {{ .Values.gcs.bucket | quote }}
          region: {{ .Values.gcs.region | quote }}
          reuse_if_exists: true
          compression: gzip
          file_prefix: logs
          partition:
            prefix: {{ .Values.gcs.prefix | quote }}
            format: year=%Y/month=%m/day=%d/hour=%H/minute=%M
        timeout: 30s
        sending_queue:
          enabled: true
          queue_size: 1000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 300s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [google_cloud_storage]

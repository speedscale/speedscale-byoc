{{- if .Values.reader.enabled }}
{{- if eq (include "gcs.readerServiceAccount" .) (include "gcs.serviceAccount" .) }}
{{- fail "reader and collector must use separate service accounts" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gcs.readerName" . }}
data:
  reader.json: |
    {"version":1,"destinations":[{"id":"google_cloud_storage","bucket":{{ .Values.gcs.bucket | toJson }},"prefix":{{ printf "%s/" .Values.gcs.prefix | toJson }}}]}
---
{{- if .Values.reader.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gcs.readerServiceAccount" . }}
  annotations: {{ toYaml .Values.reader.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gcs.readerName" . }}
spec:
  serviceName: {{ include "gcs.readerName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxymock-bucket-reader
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxymock-bucket-reader
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/reader: {{ toJson (dict "bucket" .Values.gcs.bucket "prefix" .Values.gcs.prefix) | sha256sum }}
    spec:
      serviceAccountName: {{ include "gcs.readerServiceAccount" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: {{ required "reader.image must name a release with bucket-reader support" .Values.reader.image | quote }}
          command: ["/usr/local/bin/proxymock", "bucket-reader"]
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{ toYaml .Values.reader.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/proxymock, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "gcs.readerName" . }}
        - name: tmp
          emptyDir: {}
{{- if .Values.reader.rbac.create }}
{{- if not .Values.reader.rbac.subjects }}
{{- fail "reader.rbac.subjects must name the Kubernetes users or groups allowed to read traffic" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gcs.readerName" . }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [{{ printf "%s-0" (include "gcs.readerName" .) | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    resourceNames: [{{ printf "%s-0" (include "gcs.readerName" .) | quote }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gcs.readerName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gcs.readerName" . }}
subjects: {{ toYaml .Values.reader.rbac.subjects | nindent 2 }}
{{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gcs.serviceAccount" . }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gcs.name" . }}
spec:
  replicas: 1
{{- if .Values.delivery.persistence.enabled }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      app: {{ include "gcs.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "gcs.name" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "gcs.serviceAccount" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.image }}
          args: ["--config=/conf/otel.yaml"]
{{- if ne .Values.auth.mode "ambient" }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/google/credentials.json
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
{{- if ne .Values.auth.mode "ambient" }}
            - {name: google-credentials, mountPath: /var/run/google, readOnly: true}
{{- end }}
{{- if eq .Values.auth.mode "federation" }}
            - {name: google-token, mountPath: /var/run/service-account, readOnly: true}
{{- end }}
{{- if .Values.delivery.persistence.enabled }}
            - {name: queue, mountPath: /var/lib/otel}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gcs.name" . }}
{{- if eq .Values.auth.mode "secret" }}
        - name: google-credentials
          secret:
            secretName: {{ .Values.auth.secretName | quote }}
            items:
              - {key: credentials.json, path: credentials.json}
{{- else if eq .Values.auth.mode "federation" }}
        - name: google-credentials
          configMap:
            name: {{ .Values.auth.configMapName | quote }}
            items:
              - {key: credentials.json, path: credentials.json}
        - name: google-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.auth.audience | quote }}
                  expirationSeconds: 3600
                  path: token
{{- end }}
{{- if .Values.delivery.persistence.enabled }}
        - name: queue
          persistentVolumeClaim:
            claimName: {{ include "gcs.name" . }}-queue
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcs.name" . }}
spec:
  selector:
    app: {{ include "gcs.name" . }}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
{{- if .Values.delivery.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gcs.name" . }}-queue
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.delivery.persistence.size }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  otel.yaml: |
    receivers:
      otlp:
        # Both gRPC (4317) and HTTP (4318) — forwarder's byoc_azure exporter
        # uses gRPC; HTTP left in for curl-based testing.
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      batch: {}

    exporters:
      # Write RRPair blobs directly to Azure Blob Storage via the collector's
      # native azure_blob exporter. connection_string overrides url, but both
      # are set; format json = OTLP-JSON blobs. The ${env:...} refs are kept
      # literal so the collector expands them at runtime from the pod env.
      azure_blob:
        url: ${env:AZURE_BLOB_URL}
        auth:
          type: connection_string
          connection_string: ${env:AZURE_CONNECTION_STRING}
        container:
          logs: {{ .Values.azure.container | quote }}
        format: json
        sending_queue:
          enabled: true
          queue_size: {{ .Values.delivery.queueSize }}
          storage: file_storage
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otel/queue
        create_directory: true

    service:
      extensions: [health_check, file_storage]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [azure_blob, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.image.otelCollector }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          args:
            - "--config=/conf/otel.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: health
          env:
            # Plain storage-account blob URL. connection_string overrides it,
            # but the azureblob exporter still expects the field populated.
            - name: AZURE_BLOB_URL
              value: {{ .Values.azure.url | quote }}
            # Connection string holds account name + key; the exporter uses it
            # for both endpoint resolution and authentication.
            - name: AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.azure.connectionStringSecret }}
                  key: connectionString
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: queue
              mountPath: /var/lib/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: queue
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-otel-queue
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-otel-queue
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.delivery.persistence.size }}

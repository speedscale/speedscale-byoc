{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-datadog-ingress
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-datadog
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dynatrace
  labels:
    byoc.speedscale.com/provider: dynatrace
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      transform/errors:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.status_code"] != nil and span.attributes["http.status_code"] >= 500
              - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] >= 500
          - context: spanevent
            statements:
              - set(span.status.code, STATUS_CODE_ERROR) where spanevent.name == "exception"
              - set(span.attributes["error.type"], spanevent.attributes["exception.type"]) where spanevent.name == "exception" and spanevent.attributes["exception.type"] != nil
              - set(span.attributes["error.message"], spanevent.attributes["exception.message"]) where spanevent.name == "exception" and spanevent.attributes["exception.message"] != nil
      transform/captures:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["speedscale.workload"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["speedscale.direction"], log.body["direction"]) where log.body["direction"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["Traceparent"][0]) where log.body["http"]["req"]["headers"]["Traceparent"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["traceparent"][0]) where log.body["http"]["req"]["headers"]["traceparent"] != nil
              - set(log.cache["context"], ExtractPatterns(log.cache["traceparent"], "^00-(?P<trace>[0-9a-f]{32})-(?P<span>[0-9a-f]{16})-[0-9a-f]{2}$")) where log.cache["traceparent"] != nil
              - set(log.trace_id, TraceID(log.cache["context"]["trace"])) where log.cache["context"]["trace"] != nil
              - set(log.span_id, SpanID(log.cache["context"]["span"])) where log.cache["context"]["span"] != nil
      cumulativetodelta:
        max_staleness: 25h
      batch:
        timeout: 1s
        send_batch_size: 100
    exporters:
      otlphttp/dynatrace:
        endpoint: {{ .Values.dynatrace.endpoint | quote }}
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 1000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 300s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/captures, batch]
          exporters: [otlphttp/dynatrace]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/errors, batch]
          exporters: [otlphttp/dynatrace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, cumulativetodelta, batch]
          exporters: [otlphttp/dynatrace]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dynatrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-dynatrace
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-dynatrace
        app.kubernetes.io/version: {{ .Chart.Version | quote }}
    spec:
      containers:
        - name: collector
          image: {{ .Values.image }}
          args: ["--config=/conf/otel.yaml"]
          env:
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dynatrace.credentialsSecret }}
                  key: {{ .Values.dynatrace.tokenField }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-dynatrace
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dynatrace
spec:
  selector:
    app: {{ .Release.Name }}-dynatrace
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}

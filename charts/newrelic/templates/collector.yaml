apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-newrelic
  labels:
    byoc.speedscale.com/provider: newrelic
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      transform/errors:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.status_code"] != nil and span.attributes["http.status_code"] >= 500
              - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] >= 500
          - context: spanevent
            statements:
              - set(span.status.code, STATUS_CODE_ERROR) where spanevent.name == "exception"
              - set(span.attributes["error.type"], spanevent.attributes["exception.type"]) where spanevent.name == "exception" and spanevent.attributes["exception.type"] != nil
              - set(span.attributes["error.message"], spanevent.attributes["exception.message"]) where spanevent.name == "exception" and spanevent.attributes["exception.message"] != nil
      transform/captures:
        error_mode: propagate
        log_statements:
          - context: log
            statements:
              - set(log.attributes["service.name"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["hostname"], log.body["netinfo"]["upstream"]["hostname"]) where log.body["netinfo"] != nil and log.body["netinfo"]["upstream"] != nil and log.body["netinfo"]["upstream"]["hostname"] != nil
              - set(log.attributes["server.address"], log.body["netinfo"]["upstream"]["hostname"]) where log.body["netinfo"] != nil and log.body["netinfo"]["upstream"] != nil and log.body["netinfo"]["upstream"]["hostname"] != nil
              - set(log.attributes["network.peer.address"], log.body["netinfo"]["upstream"]["hostname"]) where log.body["netinfo"] != nil and log.body["netinfo"]["upstream"] != nil and log.body["netinfo"]["upstream"]["hostname"] != nil
              - set(log.attributes["msgType"], log.body["msgType"]) where log.body["msgType"] != nil
              - set(log.attributes["speedscale.workload"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["speedscale.direction"], log.body["direction"]) where log.body["direction"] != nil
              - set(log.attributes["speedscale.protocol"], log.body["l7protocol"]) where log.body["l7protocol"] != nil
              - set(log.attributes["speedscale.command"], log.body["command"]) where log.body["command"] != nil
              - set(log.attributes["speedscale.status"], log.body["status"]) where log.body["status"] != nil
              - set(log.attributes["http.request.method"], log.body["http"]["req"]["method"]) where log.body["http"] != nil and log.body["http"]["req"] != nil and log.body["http"]["req"]["method"] != nil
              - set(log.attributes["url.path"], log.body["http"]["req"]["uri"]) where log.body["http"] != nil and log.body["http"]["req"] != nil and log.body["http"]["req"]["uri"] != nil
              - set(log.attributes["http.response.status_code"], log.body["http"]["res"]["statusCode"]) where log.body["http"] != nil and log.body["http"]["res"] != nil and log.body["http"]["res"]["statusCode"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["Traceparent"][0]) where log.body["http"] != nil and log.body["http"]["req"] != nil and log.body["http"]["req"]["headers"] != nil and log.body["http"]["req"]["headers"]["Traceparent"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["traceparent"][0]) where log.body["http"] != nil and log.body["http"]["req"] != nil and log.body["http"]["req"]["headers"] != nil and log.body["http"]["req"]["headers"]["traceparent"] != nil
              - set(log.cache["context"], ExtractPatterns(log.cache["traceparent"], "^00-(?P<trace>[0-9a-f]{32})-(?P<span>[0-9a-f]{16})-[0-9a-f]{2}$")) where log.cache["traceparent"] != nil
              - set(log.trace_id, TraceID(log.cache["context"]["trace"])) where log.cache["context"]["trace"] != nil
              - set(log.span_id, SpanID(log.cache["context"]["span"])) where log.cache["context"]["span"] != nil and log.body["direction"] == "OUT"
              - set(log.span_id, SpanID(0x0000000000000000)) where log.body["direction"] == "IN"
              - set(log.cache["summary"], Concat([log.body["direction"], log.body["l7protocol"]], " "))
              - set(log.cache["summary"], Concat([log.body["direction"], log.body["l7protocol"], log.body["command"]], " ")) where log.body["command"] != nil
              - set(log.cache["summary"], Concat([log.attributes["speedscale.direction"], log.attributes["http.request.method"], log.attributes["url.path"]], " ")) where log.attributes["http.request.method"] != nil and log.attributes["url.path"] != nil
              - set(log.body, log.cache["summary"])
      groupbyattrs/service:
        keys:
          - service.name
      batch:
        timeout: 1s
        send_batch_size: 100
        send_batch_max_size: 200
      metricstransform/newrelic_apm:
        transforms:
          - include: traces.span.metrics.duration
            action: update
            new_name: http.server.duration
      filter/newrelic_apm:
        error_mode: propagate
        metrics:
          metric:
            - name != "http.server.duration"
          datapoint:
            - attributes["span.kind"] != "SPAN_KIND_SERVER" and attributes["span.kind"] != "SERVER"
            - attributes["http.method"] == nil
            - attributes["http.route"] == nil
    connectors:
      span_metrics/newrelic:
        histogram:
          unit: ms
        dimensions:
          - name: http.method
          - name: http.route
          - name: http.status_code
        exclude_dimensions:
          - collector.instance.id
        metrics_flush_interval: 10s
        metrics_expiration: 5m
        resource_metrics_key_attributes:
          - service.name
          - service.namespace
          - deployment.environment.name
    exporters:
      otlphttp/newrelic:
        endpoint: {{ .Values.newrelic.endpoint | quote }}
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        sending_queue:
          enabled: true
          queue_size: {{ .Values.delivery.queueSize }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.delivery.retryMaxElapsedTime }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/captures, groupbyattrs/service, batch]
          exporters: [otlphttp/newrelic]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/errors, batch]
          exporters: [otlphttp/newrelic, span_metrics/newrelic]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/newrelic]
        metrics/newrelic_apm:
          receivers: [span_metrics/newrelic]
          processors: [metricstransform/newrelic_apm, filter/newrelic_apm, batch]
          exporters: [otlphttp/newrelic]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-newrelic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-newrelic
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-newrelic
        app.kubernetes.io/version: {{ .Chart.Version | quote }}
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["--config=/conf/otel.yaml"]
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.newrelic.credentialsSecret }}
                  key: {{ .Values.newrelic.licenseKeyField }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-newrelic
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-newrelic
spec:
  selector:
    app: {{ .Release.Name }}-newrelic
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}

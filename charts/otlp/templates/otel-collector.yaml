{{- if and (or .Values.otlp.signals.traces .Values.otlp.signals.metrics) (not .Values.otlp.baseEndpoint) }}
{{- fail "otlp.baseEndpoint is required when traces or metrics are enabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-collector
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      {{- if .Values.securityProfile.enabled }}
      transform/security:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["event.kind"], "event")
              - set(log.attributes["event.category"], "network")
              - set(log.attributes["event.type"], "access")
              - set(log.attributes["speedscale.message_type"], log.body["msgType"]) where log.body["msgType"] != nil
              - set(log.attributes["k8s.workload.name"], log.body["service"]) where log.body["service"] != nil
              - set(log.attributes["network.direction"], log.body["direction"]) where log.body["direction"] != nil
              - set(log.attributes["speedscale.traffic_id"], log.body["uuid"]) where log.body["uuid"] != nil
              - set(log.attributes["speedscale.dlp_modified"], log.body["dlpModified"]) where log.body["dlpModified"] != nil
              - set(log.attributes["network.protocol.name"], log.body["l7protocol"]) where log.body["l7protocol"] != nil
              - set(log.attributes["http.request.method"], log.body["command"]) where log.body["command"] != nil and log.body["l7protocol"] == "http"
              - set(log.attributes["http.response.status_code"], Int(log.body["status"])) where log.body["status"] != nil and log.body["l7protocol"] == "http"
              - set(log.attributes["url.path"], log.body["location"]) where log.body["location"] != nil and log.body["l7protocol"] == "http"
              - set(log.attributes["client.address"], log.body["source"]) where log.body["source"] != nil
              - set(log.attributes["server.address"], log.body["destination"]) where log.body["destination"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["Traceparent"][0]) where log.body["http"]["req"]["headers"]["Traceparent"] != nil
              - set(log.cache["traceparent"], log.body["http"]["req"]["headers"]["traceparent"][0]) where log.body["http"]["req"]["headers"]["traceparent"] != nil
              - set(log.cache["context"], ExtractPatterns(log.cache["traceparent"], "^00-(?P<trace>[0-9a-f]{32})-(?P<span>[0-9a-f]{16})-[0-9a-f]{2}$")) where log.cache["traceparent"] != nil
              - set(log.trace_id, TraceID(log.cache["context"]["trace"])) where log.cache["context"]["trace"] != nil
              - set(log.span_id, SpanID(log.cache["context"]["span"])) where log.cache["context"]["span"] != nil
              {{- if not .Values.securityProfile.includeFullPayload }}
              - set(log.body, log.attributes)
              {{- end }}
      {{- end }}
      batch:
        timeout: 1s
        send_batch_size: 100
    exporters:
      {{- if .Values.otlp.signals.logs }}
      otlphttp/logs:
        logs_endpoint: ${env:OTLP_LOGS_ENDPOINT}
        headers:
          {{ .Values.otlp.headerName }}: "{{ .Values.otlp.headerPrefix }}${env:OTLP_TOKEN}"
          {{- range $name, $value := .Values.otlp.additionalHeaders }}
          {{ $name }}: {{ $value | quote }}
          {{- end }}
        compression: {{ .Values.otlp.compression }}
        tls:
          insecure_skip_verify: {{ .Values.otlp.tls.insecureSkipVerify }}
          {{- if .Values.otlp.tls.caSecret }}
          ca_file: /tls/ca/{{ .Values.otlp.tls.caKey }}
          {{- end }}
          {{- if .Values.otlp.tls.clientSecret }}
          cert_file: /tls/client/{{ .Values.otlp.tls.certKey }}
          key_file: /tls/client/{{ .Values.otlp.tls.keyKey }}
          {{- end }}
        sending_queue:
          enabled: true
          queue_size: {{ .Values.delivery.queueSize }}
          {{- if .Values.delivery.persistence.enabled }}
          storage: file_storage
          {{- end }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.delivery.retryMaxElapsedTime }}
      {{- end }}
      {{- if or .Values.otlp.signals.traces .Values.otlp.signals.metrics }}
      otlphttp/signals:
        endpoint: ${env:OTLP_BASE_ENDPOINT}
        headers:
          {{ .Values.otlp.headerName }}: "{{ .Values.otlp.headerPrefix }}${env:OTLP_TOKEN}"
          {{- range $name, $value := .Values.otlp.additionalHeaders }}
          {{ $name }}: {{ $value | quote }}
          {{- end }}
        compression: {{ .Values.otlp.compression }}
        tls:
          insecure_skip_verify: {{ .Values.otlp.tls.insecureSkipVerify }}
          {{- if .Values.otlp.tls.caSecret }}
          ca_file: /tls/ca/{{ .Values.otlp.tls.caKey }}
          {{- end }}
          {{- if .Values.otlp.tls.clientSecret }}
          cert_file: /tls/client/{{ .Values.otlp.tls.certKey }}
          key_file: /tls/client/{{ .Values.otlp.tls.keyKey }}
          {{- end }}
        sending_queue:
          enabled: true
          queue_size: {{ .Values.delivery.queueSize }}
          {{- if .Values.delivery.persistence.enabled }}
          storage: file_storage
          {{- end }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.delivery.retryMaxElapsedTime }}
      {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if .Values.delivery.persistence.enabled }}
      file_storage:
        directory: /var/lib/otel/queue
        create_directory: true
      {{- end }}
    service:
      extensions: [health_check{{ if .Values.delivery.persistence.enabled }}, file_storage{{ end }}]
      pipelines:
        {{- if .Values.otlp.signals.logs }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter{{ if .Values.securityProfile.enabled }}, transform/security{{ end }}, batch]
          exporters: [otlphttp/logs]
        {{- end }}
        {{- if .Values.otlp.signals.traces }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/signals]
        {{- end }}
        {{- if .Values.otlp.signals.metrics }}
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/signals]
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-collector
spec:
  replicas: 1
{{- if .Values.delivery.persistence.enabled }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-otel-collector
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-otel-collector
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.image.otelCollector }}
          args: ["--config=/conf/otel.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          env:
            - name: OTLP_LOGS_ENDPOINT
              value: {{ .Values.otlp.endpoint | quote }}
            - name: OTLP_BASE_ENDPOINT
              value: {{ .Values.otlp.baseEndpoint | quote }}
            - name: OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlp.tokenSecret }}
                  key: {{ .Values.otlp.tokenKey }}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            {{- if .Values.delivery.persistence.enabled }}
            - {name: queue, mountPath: /var/lib/otel}
            {{- end }}
            {{- if .Values.otlp.tls.caSecret }}
            - {name: tls-ca, mountPath: /tls/ca, readOnly: true}
            {{- end }}
            {{- if .Values.otlp.tls.clientSecret }}
            - {name: tls-client, mountPath: /tls/client, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-otel-collector
        {{- if .Values.delivery.persistence.enabled }}
        - name: queue
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-otel-queue
        {{- end }}
        {{- if .Values.otlp.tls.caSecret }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.otlp.tls.caSecret }}
        {{- end }}
        {{- if .Values.otlp.tls.clientSecret }}
        - name: tls-client
          secret:
            secretName: {{ .Values.otlp.tls.clientSecret }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-collector
spec:
  selector:
    app: {{ .Release.Name }}-otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
{{- if .Values.delivery.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-otel-queue
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.delivery.persistence.size }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: byoc-honeycomb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/speedscale/speedscale-byoc.git
    targetRevision: main
    path: charts/otlp
    helm:
      valueFiles:
        - examples/honeycomb.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: byoc-honeycomb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
